# Profile 4: Minimal Starter Architecture
project:
  name: my_minimal_app
  organization: com.example
  platforms:
    - android
    - ios
  device_targets:
    - phone
  ui_category: minimal

architecture:
  style: simplified_feature

state_management:
  solution: bloc_cubit

dependency_injection:
  solution: manual

networking:
  solution: dio

result_handling:
  solution: sealed_result

routing:
  solution: navigator

persistence:
  solution: secure_storage_and_prefs

offline:
  enabled: false
  strategy: none

localization:
  enabled: true
  locales:
    - ar
    - en

observability:
  enabled: false
  solution: none
