name: Enterprise Quality Gate & CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        id: format_check
        continue-on-error: true
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            echo "FORMAT_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

      - name: Run Static Analysis
        id: analyze_check
        continue-on-error: true
        run: |
          if ! flutter analyze; then
            echo "ANALYZE_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

      - name: Run Tests with Coverage
        id: test_check
        continue-on-error: true
        run: |
          if ! flutter test --coverage; then
            echo "TESTS_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

      - name: Filter Generated Files & Generate HTML
        if: always()
        run: |
          if [ -f "coverage/lcov.info" ]; then
            sudo apt-get install -y lcov
            # Filtering generated files from coverage calculation
            lcov --remove coverage/lcov.info \
              'lib/**/*.g.dart' \
              'lib/**/*.freezed.dart' \
              'lib/**/*.config.dart' \
              -o coverage/lcov.info --ignore-errors unused
            
            # Generating interactive HTML report
            genhtml coverage/lcov.info -o coverage/html --ignore-errors source
          fi

      - name: Run Coverage & Quality Gate Summary
        if: always()
        run: dart run scripts/check_coverage.dart

      - name: Archive Coverage HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/html/
          retention-days: 7
